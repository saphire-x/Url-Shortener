services:

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: url-shortener

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      # allowPublicKeyRetrieval=true  → required for MySQL 8 caching_sha2_password
      # useSSL=false                  → dev-friendly, avoids SSL cert errors
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/urlshortener?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootkK@123

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    # Optional: uncomment to cap resources for cleaner `docker stats` diagnostics.
    # Leave commented for normal use — don't want to accidentally throttle yourself.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 1g

  k6:
    image: grafana/k6
    container_name: k6
    profiles: ["load-test"]   # only starts when explicitly requested, see usage below
    depends_on:
      - app
    volumes:
      - ./k6:/scripts
    entrypoint: ["k6", "run", "/scripts/load-test.js"]
    environment:
      - BASE_URL=http://app:8080