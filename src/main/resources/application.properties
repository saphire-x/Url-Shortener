spring.application.name=v1

#mysql config
spring.datasource.url=jdbc:mysql://localhost:3306/urlshortener?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=rootkK@123

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# NEW: connection pool tuning (Hikari)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000

#redis config
spring.data.redis.host=localhost
spring.data.redis.port=6379

# new>redis timeout + connection pool
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=4

#rate limiter configs
ratelimit.shorten.capacity=10
ratelimit.shorten.refill-tokens=10
ratelimit.shorten.refill-duration-seconds=60
ratelimit.redirect.capacity=100
ratelimit.redirect.refill-tokens=100
ratelimit.redirect.refill-duration-seconds=60